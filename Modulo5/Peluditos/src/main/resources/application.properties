spring.application.name=Peluditos

spring.datasource.url=jdbc:postgresql://localhost:5432/veterinaria
spring.datasource.username=postgres
spring.datasource.password=root

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Clave secreta para firmar los JWT (en produccion iria en variable de entorno)
jwt.secret=EstaEsUnaClaveSecretaMuyLargaParaVetCare2026SeguridadJWT
# Duracion del token en milisegundos (aqui, 24 horas)
jwt.expiration=86400000